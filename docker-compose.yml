services:
  postgres-dev:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-academic_events_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - academic_pgdata:/var/lib/postgresql/data

  redis-dev:
    image: redis:7
    container_name: redis-dev
    ports:
      - "6379:6379"

volumes:
  academic_pgdata:
