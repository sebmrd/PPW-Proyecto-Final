databases:
  # 1. Base de datos PostgreSQL
  - name: postgres-academic-db
    plan: free
    postgresMajorVersion: 15

services:
  # 2. Caché Redis
  - type: redis
    name: redis-academic-cache
    plan: free
    ipAllowList: []

  # 3. Backend Spring Boot
  - type: web
    name: backend-academic-events
    env: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: postgres-academic-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres-academic-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: postgres-academic-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres-academic-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres-academic-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis-academic-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis-academic-cache
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 900000
      - key: JWT_REFRESH_EXPIRATION
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: "https://backend-academic-events.onrender.com"
